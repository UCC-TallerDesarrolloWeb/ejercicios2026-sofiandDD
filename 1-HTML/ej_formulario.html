<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form name="form-suscripcion">
<p>Nombre: <input type="text" name="nombre" placeholder="ingrese su nombre"></p>
<p>Apellido: <input type="text" name="apellido" placeholder="ingrese su apellido"></p>
<p>Sexo: Masculino <input type="radio" name="sex" value="masculino">
Femenino <input type="radio" name="sex" value="fememino"></p>
<p>Edad: <input type="number" name="edad" placeholder="edad"></p>
<p>Email: <input type="email" name="email" placeholder="usuario@dominio.com"></p>
<p>Usuario: <input type="text" name="usuario" placeholder="nombre de usuario"></p>
<p>Password: <input type="password" name="password" placeholder="contraseña"></p>
<p>Confirmar Password:  <input type="password" name="password" placeholder="contraseña"></p>
</form>

<p>
Tipo de servicio:
<select name="tipo-servicio">
    <option value="Free">Free</option>
    <option value="standard">standard</option>
    <option value="premium">premium</option>
</select>  </p>
<p>
Tema:
Política <input type="checkbox" value="politica">
Negocios <input type="checkbox" value="negocios">
Tecnología <input type="checkbox" value="Tecn1ología">
Salud <input type="checkbox" value="salud">
</p>

<p>Agregue un comentario:
    <textarea>
        Deje su comentario..
    </textarea>
</p>

<p><button type="button">Boton de Enviar</button> </p>



</body>
</html>
