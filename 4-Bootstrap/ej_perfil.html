<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Íconos de Google: material-symbols-outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <style>
        .card {
            width: 18rem;
        }
        .card-img-top {
            height: 170px;
            object-fit: cover;
        }
        /* Clase propia: sube el avatar para que quede encima de la portada */
        .profile {
            width: 140px;
            height: 140px;
            object-fit: cover;
            margin-top: -70px;   /* la mitad de su alto */
        }
    </style>
</head>
<body>

<!-- d-flex + justify-content-center: centra la card; my-5: margen arriba y abajo -->
<div class="d-flex justify-content-center my-5">
    <div class="card">

        <!-- Imagen de portada -->
        <img src="https://picsum.photos/id/1018/600/340" class="card-img-top" alt="Portada">

        <!-- position-relative: contexto para "montar" el avatar sobre la portada -->
        <div class="position-relative d-flex justify-content-center">
            <img src="https://i.pravatar.cc/280?img=47" class="profile rounded-circle" alt="Foto de perfil">
        </div>

        <div class="card-body text-center">
            <h5 class="card-title fw-bold">Sofía</h5>
            <p class="card-text">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. In pulvinar lacus risus,
                et convallis ante sodales eget. Nulla ornare dui non tellus varius tincidunt.
            </p>
            <a href="#" class="btn btn-primary">Ver perfil</a>
        </div>

        <!-- list-group-flush: la lista queda pegada a la card, sin bordes de afuera -->
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action d-flex gap-2 align-items-center">
                <span class="material-symbols-outlined">comment</span>
                Ir a mensajes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex gap-2 align-items-center">
                <span class="material-symbols-outlined">notifications_active</span>
                Notificaciones
                <span class="badge bg-danger">+99</span>
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex gap-2 align-items-center">
                <span class="material-symbols-outlined">group</span>
                Solicitudes Pendientes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex gap-2 align-items-center">
                <span class="material-symbols-outlined">videocam</span>
                Llamar
            </a>
        </div>

    </div>
</div>

</body>
</html>
