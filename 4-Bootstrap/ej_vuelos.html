<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selector de vuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Íconos de Google: material-symbols-outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <style>
        /* Clases propias */
        .calendar-container {
            width: 900px;
            max-width: 95vw;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);   /* 7 días por fila */
            row-gap: 6px;
        }
        .calendar-grid .btn {
            width: 40px;
            height: 40px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="dropdown">
    <!-- Botón azul que abre el componente -->
    <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside">
        Selecciona la fecha
    </button>

    <!-- data-bs-auto-close="outside": no se cierra al hacer clic adentro del calendario -->
    <div class="dropdown-menu p-4 fw-bold calendar-container">
        <h4 class="text-center">Fechas de Vuelos</h4>

        <!-- Navegación: flecha + mes a la izquierda, mes + flecha a la derecha -->
        <div class="row py-3">
            <div class="col d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary d-flex">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <span>Septiembre 2025</span>
            </div>
            <div class="col d-flex justify-content-end align-items-center gap-2">
                <span>Octubre 2025</span>
                <button class="btn btn-outline-secondary d-flex">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </div>

        <!-- Los dos meses, separados con border-end -->
        <div class="row fw-normal">
            <div class="col border-end">
                    <div class="calendar-grid text-center">
                        <span class="fw-bold py-2">Lun</span>
                        <span class="fw-bold py-2">Mar</span>
                        <span class="fw-bold py-2">Mie</span>
                        <span class="fw-bold py-2">Jue</span>
                        <span class="fw-bold py-2">Vie</span>
                        <span class="fw-bold py-2">Sab</span>
                        <span class="fw-bold py-2">Dom</span>
                        <button class="btn text-secondary">1</button>
                        <button class="btn text-secondary">2</button>
                        <button class="btn text-secondary">3</button>
                        <button class="btn text-secondary">4</button>
                        <button class="btn text-secondary">5</button>
                        <button class="btn text-secondary">6</button>
                        <button class="btn text-secondary">7</button>
                        <button class="btn text-secondary">8</button>
                        <button class="btn text-secondary">9</button>
                        <button class="btn text-secondary">10</button>
                        <button class="btn text-secondary">11</button>
                        <button class="btn text-secondary">12</button>
                        <button class="btn text-secondary">13</button>
                        <button class="btn text-secondary">14</button>
                        <button class="btn text-secondary">15</button>
                        <button class="btn text-secondary">16</button>
                        <button class="btn text-secondary">17</button>
                        <button class="btn text-secondary">18</button>
                        <button class="btn text-secondary">19</button>
                        <button class="btn text-secondary">20</button>
                        <button class="btn text-secondary">21</button>
                        <button class="btn text-secondary">22</button>
                        <button class="btn text-secondary">23</button>
                        <button class="btn text-secondary">24</button>
                        <button class="btn text-secondary">25</button>
                        <button class="btn text-secondary">26</button>
                        <button class="btn text-secondary">27</button>
                        <button class="btn text-secondary">28</button>
                        <button class="btn text-secondary">29</button>
                        <button class="btn text-secondary">30</button>
                        <button class="btn text-secondary opacity-50">1</button>
                        <button class="btn text-secondary opacity-50">2</button>
                        <button class="btn text-secondary opacity-50">3</button>
                        <button class="btn text-secondary opacity-50">4</button>
                        <button class="btn text-secondary opacity-50">5</button>
                    </div>
            </div>
            <div class="col">
                    <div class="calendar-grid text-center">
                        <span class="fw-bold py-2">Lun</span>
                        <span class="fw-bold py-2">Mar</span>
                        <span class="fw-bold py-2">Mie</span>
                        <span class="fw-bold py-2">Jue</span>
                        <span class="fw-bold py-2">Vie</span>
                        <span class="fw-bold py-2">Sab</span>
                        <span class="fw-bold py-2">Dom</span>
                        <button class="btn text-secondary">1</button>
                        <button class="btn text-secondary">2</button>
                        <button class="btn text-secondary">3</button>
                        <button class="btn text-secondary">4</button>
                        <button class="btn text-secondary">5</button>
                        <button class="btn text-secondary">6</button>
                        <button class="btn text-secondary">7</button>
                        <button class="btn text-secondary">8</button>
                        <button class="btn text-secondary">9</button>
                        <button class="btn text-secondary">10</button>
                        <button class="btn text-secondary">11</button>
                        <button class="btn text-secondary">12</button>
                        <button class="btn text-secondary">13</button>
                        <button class="btn text-secondary">14</button>
                        <button class="btn text-secondary">15</button>
                        <button class="btn text-secondary">16</button>
                        <button class="btn text-secondary">17</button>
                        <button class="btn text-secondary">18</button>
                        <button class="btn text-secondary">19</button>
                        <button class="btn text-secondary">20</button>
                        <button class="btn text-secondary">21</button>
                        <button class="btn text-secondary">22</button>
                        <button class="btn text-secondary">23</button>
                        <button class="btn text-secondary">24</button>
                        <button class="btn text-secondary">25</button>
                        <button class="btn text-secondary">26</button>
                        <button class="btn text-secondary">27</button>
                        <button class="btn text-secondary">28</button>
                        <button class="btn text-secondary">29</button>
                        <button class="btn text-secondary">30</button>
                        <button class="btn text-secondary opacity-50">1</button>
                        <button class="btn text-secondary opacity-50">2</button>
                        <button class="btn text-secondary opacity-50">3</button>
                        <button class="btn text-secondary opacity-50">4</button>
                        <button class="btn text-secondary opacity-50">5</button>
                    </div>
            </div>
        </div>

        <!-- Botones de abajo: uno a cada punta -->
        <div class="d-flex justify-content-between pt-4">
            <button class="btn btn-outline-secondary">Cancelar</button>
            <button class="btn btn-outline-primary">Guardar</button>
        </div>
    </div>
</div>

<!-- JS de Bootstrap: sin esto el dropdown no abre -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
